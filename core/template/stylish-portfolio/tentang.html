{# stylish-portfolio#4 — section#about (index.html:42); id diganti "tentang". #}
{% import '@stylish-portfolio/url.html' as url %}
<section class="content-section bg-light" id="tentang">
    <div class="container px-4 px-lg-5 text-center">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-lg-10">
                <h2>{{ landing.tentang.judul }}</h2>
                <p class="lead mb-5">{{ landing.tentang.teks }}</p>
                {% if landing.tentang.tombol|default(null) %}
                <a class="btn btn-dark btn-xl" href="{{ url.ke(landing.tentang.tombol.url, _context) }}">{{ landing.tentang.tombol.label }}</a>
                {% endif %}
            </div>
        </div>
    </div>
</section>
