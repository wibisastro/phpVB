{# Tema stylish-portfolio (StartBootstrap Stylish Portfolio v6.0.6) — tema HALAMAN PUBLIK,
   bukan overlay cube: tidak ada file cube*, tidak diaktifkan lewat <template>. App memakainya
   dari apps/{app}/view/body.html: {% extends "@stylish-portfolio/layout.html" %} (namespace
   tema didaftarkan core/init/template.php). Teks datang dari model app (landing.*).
   SENGAJA tidak include cubeHead.html: styles.css sudah membawa Bootstrap 5.2.3 sendiri.
   Tidak ada #app / createPageApp — tanpa Vue. "Sidebar" vendor = menu offcanvas halaman
   publik (bukan app shell), tetap dibawa sebagai section menu.html.
   Dibuang: Font Awesome + Simple Line Icons (2 CDN ikon) → bootstrap-icons /cube/fonts;
   iframe Google Maps → opsional (landing.kontak.peta). Google Fonts Source Sans Pro tetap CDN
   (keputusan 13 Okt 2026). JS vendor (vanilla) di-port ke /stylish-portfolio/js/. #}
<!DOCTYPE html>
<html lang="id">
<head>
{% block head %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="{{ landing.deskripsi }}" />
    <title>{{ pageTitle }}</title>
    <link rel="icon" type="image/png" href="{{ webroot }}/images/logo-krisna.png" />
    <link rel="stylesheet" href="{{ webroot }}/cube/fonts/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="{{ webroot }}/stylish-portfolio/css/styles.css" />
    <link rel="stylesheet" href="{{ webroot }}/stylish-portfolio/css/stylish-portfolio.css" />
{% endblock %}
</head>
<body id="page-top">
{% block content %}{% endblock %}
{# stylish-portfolio#11 — tombol gulir ke atas (index.html:194); fa-angle-up → bi-chevron-up #}
<a class="scroll-to-top rounded" href="#page-top" aria-label="Ke atas"><i class="bi-chevron-up"></i></a>
<script src="{{ webroot }}/cube/js/bootstrap.bundle.min.js"></script>
<script src="{{ webroot }}/stylish-portfolio/js/stylish-portfolio.js"></script>
{% block externalJS %}{% endblock %}
</body>
</html>
