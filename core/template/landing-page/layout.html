{# Tema landing-page (StartBootstrap Landing Page v6.0.6) — tema HALAMAN PUBLIK, bukan
   overlay cube: tidak ada file cube*, tidak diaktifkan lewat <template>. App memakainya
   dari apps/{app}/view/body.html: {% extends "@landing-page/layout.html" %} (namespace
   tema didaftarkan core/init/template.php). Teks datang dari model app (landing.*).
   SENGAJA tidak include cubeHead.html: styles.css sudah membawa Bootstrap 5.2.3 sendiri;
   main.min.css cube akan bertumpuk. Tidak ada #app / createPageApp — tanpa Vue.
   Aset: ikon + bootstrap bundle dari /cube (milik framework); css + gambar dari
   public/landing-page/ (aset TEMA boleh di public/ — tema bukan app, tak membayangi rute).
   Google Fonts Lato tetap CDN (keputusan 13 Okt 2026). #}
<!DOCTYPE html>
<html lang="id">
<head>
{% block head %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="{{ landing.deskripsi }}" />
    <title>{{ pageTitle }}</title>
    <link rel="icon" type="image/png" href="{{ webroot }}/images/logo-krisna.png" />
    <link rel="stylesheet" href="{{ webroot }}/cube/fonts/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700,300italic,400italic,700italic" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="{{ webroot }}/landing-page/css/styles.css" />
    <link rel="stylesheet" href="{{ webroot }}/landing-page/css/landing-page.css" />
{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
<script src="{{ webroot }}/cube/js/bootstrap.bundle.min.js"></script>
{% block externalJS %}{% endblock %}
</body>
</html>
